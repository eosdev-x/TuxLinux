name: Validate source
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - run: |
          bash -n build_files/build.sh
          shellcheck build_files/*.sh scripts/*.sh
          python3 -m unittest discover -s tests -v
          python3 - <<'PY'
          import pathlib, tomllib
          for path in pathlib.Path('disk_config').glob('*.toml'):
              tomllib.loads(path.read_text())
          PY
  signing-key:
    # Fork PRs cannot access repository secrets. Same-repository PRs validate
    # that the shipped trust key matches the key used by the publishing job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.1'
      - name: Check publishing key matches the committed public key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          cosign public-key --key env://COSIGN_PRIVATE_KEY > /tmp/signing-key.pub
          diff -u cosign.pub /tmp/signing-key.pub
  native-sdk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Build and link native SDK dependencies
        run: podman build -f Containerfile.devel -t localhost/tuxlinux-native-sdk:test .
